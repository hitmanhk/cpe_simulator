  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;retry-backoff-lab&quot;&gt;
  &lt;style&gt;
    #retry-backoff-lab {
      width: 100%;
      color: var(--foreground);
    }
    #retry-backoff-lab .rbl-meta,
    #retry-backoff-lab .rbl-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      color: var(--muted-foreground);
    }
    #retry-backoff-lab .rbl-meta {
      margin-bottom: 0.75rem;
    }
    #retry-backoff-lab .rbl-controls {
      margin-bottom: 0.75rem;
    }
    #retry-backoff-lab .rbl-legend {
      margin: 0.75rem 0 0.25rem;
    }
    #retry-backoff-lab .rbl-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--foreground);
    }
    #retry-backoff-lab .rbl-swatch {
      display: inline-block;
      width: 1.75rem;
      height: 0;
      border-top-width: 2px;
      border-top-style: solid;
    }
    #retry-backoff-lab .rbl-chart {
      position: relative;
      width: 100%;
    }
    #retry-backoff-lab .rbl-chart svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }
    #retry-backoff-lab .rbl-grid {
      stroke: var(--border);
      stroke-width: 1;
    }
    #retry-backoff-lab .rbl-axis {
      stroke: var(--muted-foreground);
      stroke-width: 1;
    }
    #retry-backoff-lab .rbl-tick,
    #retry-backoff-lab .rbl-axis-label {
      fill: var(--muted-foreground);
    }
    #retry-backoff-lab .rbl-hover-line {
      stroke: var(--muted-foreground);
      stroke-width: 1;
      opacity: 0;
    }
    #retry-backoff-lab .rbl-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 2;
    }
    #retry-backoff-lab .rbl-detail {
      min-height: 1.5rem;
      margin-top: 0.25rem;
      color: var(--muted-foreground);
    }
    #retry-backoff-lab .rbl-warning {
      min-height: 1.5rem;
      margin-top: 0.25rem;
    }
  &lt;/style&gt;

  &lt;div class=&quot;rbl-meta text-small&quot; aria-label=&quot;固定模拟参数&quot;&gt;
    &lt;span&gt;10,000 台设备&lt;/span&gt;
    &lt;span&gt;连续失败 7 轮&lt;/span&gt;
    &lt;span&gt;5 秒一个时间桶&lt;/span&gt;
    &lt;span&gt;每个方案使用相同随机样本&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;viz-controls rbl-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;rbl-horizon&quot;&gt;
      观察时长
      &lt;select id=&quot;rbl-horizon&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;10&quot;&gt;10 分钟&lt;/option&gt;
        &lt;option value=&quot;30&quot;&gt;30 分钟&lt;/option&gt;
        &lt;option value=&quot;60&quot; selected&gt;60 分钟&lt;/option&gt;
        &lt;option value=&quot;120&quot;&gt;120 分钟&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;button id=&quot;rbl-add&quot; type=&quot;button&quot; class=&quot;btn btn-primary&quot;&gt;添加对比方案&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;table-responsive&quot;&gt;
    &lt;table class=&quot;table table-sm&quot;&gt;
      &lt;thead&gt;
        &lt;tr&gt;
          &lt;th scope=&quot;col&quot;&gt;方案名称&lt;/th&gt;
          &lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;初始时间（秒）&lt;/th&gt;
          &lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;最大时间（秒）&lt;/th&gt;
          &lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;抖动下限&lt;/th&gt;
          &lt;th scope=&quot;col&quot; class=&quot;text-end&quot;&gt;抖动上限&lt;/th&gt;
          &lt;th scope=&quot;col&quot;&gt;&lt;span class=&quot;sr-only&quot;&gt;操作&lt;/span&gt;&lt;/th&gt;
        &lt;/tr&gt;
      &lt;/thead&gt;
      &lt;tbody id=&quot;rbl-scenarios&quot;&gt;&lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div id=&quot;rbl-warning&quot; class=&quot;rbl-warning text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;rbl-legend&quot; class=&quot;rbl-legend text-small&quot; aria-label=&quot;曲线图例&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;rbl-chart&quot; class=&quot;rbl-chart&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;rbl-detail&quot; class=&quot;rbl-detail text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;retry-backoff-lab&#x27;);
      if (!root) return;

      const DEVICE_COUNT = 10000;
      const RETRY_ROUNDS = 7;
      const BIN_SECONDS = 5;
      const MAX_SCENARIOS = 6;
      const SERIES_COLORS = [
        &#x27;var(--viz-series-1)&#x27;,
        &#x27;var(--viz-series-2)&#x27;,
        &#x27;var(--viz-series-3)&#x27;,
        &#x27;var(--viz-series-4)&#x27;,
        &#x27;var(--viz-series-5)&#x27;,
        &#x27;var(--viz-series-6)&#x27;
      ];
      const DASH_PATTERNS = [&#x27;&#x27;, &#x27;8 4&#x27;, &#x27;2 4&#x27;, &#x27;10 3 2 3&#x27;, &#x27;12 5&#x27;, &#x27;4 3&#x27;];

      let nextId = 3;
      let renderTimer;
      const scenarios = [
        { id: 1, name: &#x27;方案 A&#x27;, initial: 30, max: 1800, lower: -0.5, upper: 1.0 },
        { id: 2, name: &#x27;方案 B&#x27;, initial: 30, max: 1800, lower: -0.5, upper: 1.5 }
      ];

      const tbody = root.querySelector(&#x27;#rbl-scenarios&#x27;);
      const addButton = root.querySelector(&#x27;#rbl-add&#x27;);
      const horizonSelect = root.querySelector(&#x27;#rbl-horizon&#x27;);
      const warning = root.querySelector(&#x27;#rbl-warning&#x27;);
      const legend = root.querySelector(&#x27;#rbl-legend&#x27;);
      const chart = root.querySelector(&#x27;#rbl-chart&#x27;);
      const detail = root.querySelector(&#x27;#rbl-detail&#x27;);

      function createInput(scenario, property, options = {}) {
        const input = document.createElement(&#x27;input&#x27;);
        input.className = &#x27;form-control&#x27;;
        input.type = options.type || &#x27;number&#x27;;
        input.value = scenario[property];
        input.setAttribute(&#x27;aria-label&#x27;, `${scenario.name}${options.label || property}`);
        if (options.min !== undefined) input.min = options.min;
        if (options.max !== undefined) input.max = options.max;
        if (options.step !== undefined) input.step = options.step;
        input.addEventListener(&#x27;input&#x27;, () =&gt; {
          scenario[property] = input.type === &#x27;number&#x27; ? input.valueAsNumber : input.value;
          scheduleRender();
        });
        return input;
      }

      function renderScenarioRows() {
        tbody.replaceChildren();
        scenarios.forEach(scenario =&gt; {
          const row = document.createElement(&#x27;tr&#x27;);
          const nameCell = document.createElement(&#x27;td&#x27;);
          const initialCell = document.createElement(&#x27;td&#x27;);
          const maxCell = document.createElement(&#x27;td&#x27;);
          const lowerCell = document.createElement(&#x27;td&#x27;);
          const upperCell = document.createElement(&#x27;td&#x27;);
          const actionCell = document.createElement(&#x27;td&#x27;);

          initialCell.className = &#x27;text-end&#x27;;
          maxCell.className = &#x27;text-end&#x27;;
          lowerCell.className = &#x27;text-end&#x27;;
          upperCell.className = &#x27;text-end&#x27;;

          nameCell.appendChild(createInput(scenario, &#x27;name&#x27;, { type: &#x27;text&#x27;, label: &#x27;名称&#x27; }));
          initialCell.appendChild(createInput(scenario, &#x27;initial&#x27;, { label: &#x27;初始时间&#x27;, min: 1, max: 86400, step: 1 }));
          maxCell.appendChild(createInput(scenario, &#x27;max&#x27;, { label: &#x27;最大时间&#x27;, min: 1, max: 86400, step: 1 }));
          lowerCell.appendChild(createInput(scenario, &#x27;lower&#x27;, { label: &#x27;抖动下限&#x27;, min: -5, max: 10, step: 0.1 }));
          upperCell.appendChild(createInput(scenario, &#x27;upper&#x27;, { label: &#x27;抖动上限&#x27;, min: -5, max: 10, step: 0.1 }));

          const removeButton = document.createElement(&#x27;button&#x27;);
          removeButton.type = &#x27;button&#x27;;
          removeButton.className = &#x27;btn btn-ghost&#x27;;
          removeButton.textContent = &#x27;删除&#x27;;
          removeButton.disabled = scenarios.length === 1;
          removeButton.setAttribute(&#x27;aria-label&#x27;, `删除${scenario.name}`);
          removeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
            const index = scenarios.findIndex(item =&gt; item.id === scenario.id);
            if (index &gt;= 0 &amp;&amp; scenarios.length &gt; 1) {
              scenarios.splice(index, 1);
              renderScenarioRows();
              render();
            }
          });
          actionCell.appendChild(removeButton);
          row.append(nameCell, initialCell, maxCell, lowerCell, upperCell, actionCell);
          tbody.appendChild(row);
        });
        addButton.disabled = scenarios.length &gt;= MAX_SCENARIOS;
      }

      function validateScenario(scenario) {
        if (!scenario.name.trim()) return &#x27;方案名称不能为空&#x27;;
        if (!Number.isFinite(scenario.initial) || scenario.initial &lt;= 0) return &#x27;初始时间必须大于 0&#x27;;
        if (!Number.isFinite(scenario.max) || scenario.max &lt; scenario.initial) return &#x27;最大时间必须大于或等于初始时间&#x27;;
        if (!Number.isFinite(scenario.lower) || !Number.isFinite(scenario.upper)) return &#x27;抖动范围必须是数字&#x27;;
        if (scenario.lower &gt;= scenario.upper) return &#x27;抖动下限必须小于上限&#x27;;
        return &#x27;&#x27;;
      }

      function simulate(scenario, horizonSeconds) {
        const bins = new Array(Math.floor(horizonSeconds / BIN_SECONDS) + 1).fill(0);
        let seed = 20260720;
        const random = () =&gt; {
          seed = (seed * 1664525 + 1013904223) &gt;&gt;&gt; 0;
          return seed / 4294967296;
        };

        for (let device = 0; device &lt; DEVICE_COUNT; device += 1) {
          let elapsed = 0;
          for (let attempt = 0; attempt &lt; RETRY_ROUNDS; attempt += 1) {
            const base = Math.min(scenario.initial * (2 ** attempt), scenario.max);
            const jitter = scenario.lower + random() * (scenario.upper - scenario.lower);
            const delay = Math.max(base + jitter * base, scenario.initial / 2);
            elapsed += delay;
            if (elapsed &lt;= horizonSeconds) {
              bins[Math.floor(elapsed / BIN_SECONDS)] += 1;
            }
          }
        }

        const points = bins.map((count, index) =&gt; ({ second: index * BIN_SECONDS, count }));
        const peak = points.reduce((best, point) =&gt; point.count &gt; best.count ? point : best, points[0]);
        return { scenario, points, peak };
      }

      function scheduleRender() {
        window.clearTimeout(renderTimer);
        renderTimer = window.setTimeout(render, 80);
      }

      function formatTime(seconds) {
        if (seconds &lt; 60) return `${seconds} 秒`;
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds % 60;
        return remainder ? `${minutes}分${remainder}秒` : `${minutes} 分钟`;
      }

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);
        Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        return element;
      }

      function renderLegend(results) {
        legend.replaceChildren();
        results.forEach((result, index) =&gt; {
          const item = document.createElement(&#x27;span&#x27;);
          item.className = &#x27;rbl-legend-item&#x27;;
          const swatch = document.createElement(&#x27;span&#x27;);
          swatch.className = &#x27;rbl-swatch&#x27;;
          swatch.style.borderTopColor = SERIES_COLORS[index];
          swatch.style.borderTopStyle = index === 0 ? &#x27;solid&#x27; : &#x27;dashed&#x27;;
          swatch.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          const label = document.createElement(&#x27;span&#x27;);
          label.textContent = `${result.scenario.name} · 峰值 ${result.peak.count.toLocaleString()} 条/5秒`;
          item.append(swatch, label);
          legend.appendChild(item);
        });
      }

      function renderChart(results, horizonSeconds) {
        chart.replaceChildren();
        const width = 900;
        const height = 430;
        const margin = { top: 22, right: 20, bottom: 50, left: 72 };
        const plotWidth = width - margin.left - margin.right;
        const plotHeight = height - margin.top - margin.bottom;
        const globalPeak = Math.max(...results.map(result =&gt; result.peak.count), 1);
        const yMax = Math.max(100, Math.ceil((globalPeak * 1.1) / 100) * 100);
        const x = second =&gt; margin.left + (second / horizonSeconds) * plotWidth;
        const y = count =&gt; margin.top + plotHeight - (count / yMax) * plotHeight;

        const svg = createSvgElement(&#x27;svg&#x27;, {
          viewBox: `0 0 ${width} ${height}`,
          role: &#x27;img&#x27;,
          &#x27;aria-label&#x27;: `${results.length}个指数退避方案在${horizonSeconds / 60}分钟内每5秒重试消息数量的实时对比曲线`
        });
        const title = createSvgElement(&#x27;title&#x27;);
        title.textContent = &#x27;指数退避方案实时对比曲线&#x27;;
        const desc = createSvgElement(&#x27;desc&#x27;);
        desc.textContent = &#x27;曲线模拟一万台设备同时失败并连续重试七轮，每轮基础延迟翻倍并受最大时间限制，然后应用所配置的随机抖动。&#x27;;
        svg.append(title, desc);

        const yTickCount = 4;
        for (let i = 0; i &lt;= yTickCount; i += 1) {
          const value = Math.round((yMax / yTickCount) * i);
          const yy = y(value);
          svg.appendChild(createSvgElement(&#x27;line&#x27;, {
            x1: margin.left,
            y1: yy,
            x2: width - margin.right,
            y2: yy,
            class: &#x27;rbl-grid&#x27;
          }));
          const label = createSvgElement(&#x27;text&#x27;, {
            x: margin.left - 10,
            y: yy + 5,
            &#x27;text-anchor&#x27;: &#x27;end&#x27;,
            class: &#x27;rbl-tick text-small&#x27;
          });
          label.textContent = value.toLocaleString();
          svg.appendChild(label);
        }

        const xTickCount = 6;
        for (let i = 0; i &lt;= xTickCount; i += 1) {
          const second = (horizonSeconds / xTickCount) * i;
          const xx = x(second);
          svg.appendChild(createSvgElement(&#x27;line&#x27;, {
            x1: xx,
            y1: margin.top,
            x2: xx,
            y2: margin.top + plotHeight,
            class: &#x27;rbl-grid&#x27;
          }));
          const label = createSvgElement(&#x27;text&#x27;, {
            x: xx,
            y: margin.top + plotHeight + 26,
            &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
            class: &#x27;rbl-tick text-small&#x27;
          });
          label.textContent = second === 0 ? &#x27;0&#x27; : `${Math.round(second / 60)}m`;
          svg.appendChild(label);
        }

        svg.appendChild(createSvgElement(&#x27;line&#x27;, {
          x1: margin.left,
          y1: margin.top + plotHeight,
          x2: width - margin.right,
          y2: margin.top + plotHeight,
          class: &#x27;rbl-axis&#x27;
        }));
        svg.appendChild(createSvgElement(&#x27;line&#x27;, {
          x1: margin.left,
          y1: margin.top,
          x2: margin.left,
          y2: margin.top + plotHeight,
          class: &#x27;rbl-axis&#x27;
        }));

        const yAxisLabel = createSvgElement(&#x27;text&#x27;, {
          x: 16,
          y: margin.top + plotHeight / 2,
          transform: `rotate(-90 16 ${margin.top + plotHeight / 2})`,
          &#x27;text-anchor&#x27;: &#x27;middle&#x27;,
          class: &#x27;rbl-axis-label text-small&#x27;
        });
        yAxisLabel.textContent = &#x27;重试消息数 / 5秒&#x27;;
        svg.appendChild(yAxisLabel);

        results.forEach((result, index) =&gt; {
          const coordinates = result.points.map(point =&gt; `${x(point.second)},${y(point.count)}`);
          const path = createSvgElement(&#x27;path&#x27;, {
            d: `M${coordinates.join(&#x27; L&#x27;)}`,
            fill: &#x27;none&#x27;,
            stroke: SERIES_COLORS[index],
            &#x27;stroke-width&#x27;: 2,
            &#x27;stroke-linejoin&#x27;: &#x27;round&#x27;,
            &#x27;stroke-linecap&#x27;: &#x27;round&#x27;
          });
          if (DASH_PATTERNS[index]) path.setAttribute(&#x27;stroke-dasharray&#x27;, DASH_PATTERNS[index]);
          svg.appendChild(path);

          const peakDot = createSvgElement(&#x27;circle&#x27;, {
            cx: x(result.peak.second),
            cy: y(result.peak.count),
            r: 4,
            fill: SERIES_COLORS[index],
            stroke: &#x27;var(--background)&#x27;,
            &#x27;stroke-width&#x27;: 2
          });
          svg.appendChild(peakDot);
        });

        const hoverLine = createSvgElement(&#x27;line&#x27;, {
          x1: margin.left,
          y1: margin.top,
          x2: margin.left,
          y2: margin.top + plotHeight,
          class: &#x27;rbl-hover-line&#x27;
        });
        svg.appendChild(hoverLine);

        const hoverDots = results.map((result, index) =&gt; {
          const dot = createSvgElement(&#x27;circle&#x27;, {
            cx: margin.left,
            cy: y(0),
            r: 4,
            fill: SERIES_COLORS[index],
            stroke: &#x27;var(--background)&#x27;,
            &#x27;stroke-width&#x27;: 2,
            opacity: 0
          });
          svg.appendChild(dot);
          return dot;
        });

        const overlay = createSvgElement(&#x27;rect&#x27;, {
          x: margin.left,
          y: margin.top,
          width: plotWidth,
          height: plotHeight,
          fill: &#x27;transparent&#x27;,
          &#x27;aria-hidden&#x27;: &#x27;true&#x27;
        });
        svg.appendChild(overlay);

        const tooltip = document.createElement(&#x27;div&#x27;);
        tooltip.className = &#x27;tooltip rbl-tooltip text-small&#x27;;
        chart.append(svg, tooltip);

        overlay.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
          const svgRect = svg.getBoundingClientRect();
          const localX = ((event.clientX - svgRect.left) / svgRect.width) * width;
          const second = Math.max(0, Math.min(horizonSeconds, ((localX - margin.left) / plotWidth) * horizonSeconds));
          const index = Math.max(0, Math.min(results[0].points.length - 1, Math.round(second / BIN_SECONDS)));
          const selectedSecond = results[0].points[index].second;
          const pointX = x(selectedSecond);
          hoverLine.setAttribute(&#x27;x1&#x27;, pointX);
          hoverLine.setAttribute(&#x27;x2&#x27;, pointX);
          hoverLine.style.opacity = &#x27;1&#x27;;

          tooltip.replaceChildren();
          const timeLabel = document.createElement(&#x27;div&#x27;);
          timeLabel.textContent = formatTime(selectedSecond);
          tooltip.appendChild(timeLabel);
          const detailParts = [];
          let highestCount = 0;
          results.forEach((result, resultIndex) =&gt; {
            const count = result.points[index].count;
            highestCount = Math.max(highestCount, count);
            hoverDots[resultIndex].setAttribute(&#x27;cx&#x27;, pointX);
            hoverDots[resultIndex].setAttribute(&#x27;cy&#x27;, y(count));
            hoverDots[resultIndex].setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
            const row = document.createElement(&#x27;div&#x27;);
            row.textContent = `${result.scenario.name}：${count.toLocaleString()} 条/5秒`;
            tooltip.appendChild(row);
            detailParts.push(`${result.scenario.name} ${count.toLocaleString()} 条`);
          });
          tooltip.style.display = &#x27;block&#x27;;

          const scaleX = svgRect.width / width;
          const scaleY = svgRect.height / height;
          const desiredLeft = pointX * scaleX + 10;
          const desiredTop = y(highestCount) * scaleY - tooltip.offsetHeight - 8;
          tooltip.style.left = `${Math.max(0, Math.min(svgRect.width - tooltip.offsetWidth, desiredLeft))}px`;
          tooltip.style.top = `${Math.max(0, desiredTop)}px`;
          detail.textContent = `${formatTime(selectedSecond)}：${detailParts.join(&#x27;；&#x27;)}。`;
        });

        overlay.addEventListener(&#x27;pointerleave&#x27;, () =&gt; {
          hoverLine.style.opacity = &#x27;0&#x27;;
          hoverDots.forEach(dot =&gt; dot.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;));
          tooltip.style.display = &#x27;none&#x27;;
          setPeakDetail(results);
        });
      }

      function setPeakDetail(results) {
        detail.textContent = results
          .map(result =&gt; `${result.scenario.name} 峰值 ${result.peak.count.toLocaleString()} 条/5秒（约 ${formatTime(result.peak.second)}）`)
          .join(&#x27;；&#x27;) + &#x27;。&#x27;;
      }

      function render() {
        const errors = [];
        const validScenarios = [];
        scenarios.forEach(scenario =&gt; {
          const error = validateScenario(scenario);
          if (error) errors.push(`${scenario.name || &#x27;未命名方案&#x27;}：${error}`);
          else validScenarios.push(scenario);
        });

        const clamped = validScenarios.filter(scenario =&gt; scenario.lower &lt; -0.5);
        if (clamped.length) {
          errors.push(`${clamped.map(scenario =&gt; scenario.name).join(&#x27;、&#x27;)} 的抖动下限低于 −0.5，部分结果会被初始时间一半的下限截断`);
        }
        warning.className = errors.some(message =&gt; message.includes(&#x27;必须&#x27;) || message.includes(&#x27;不能为空&#x27;))
          ? &#x27;rbl-warning text-small text-destructive&#x27;
          : &#x27;rbl-warning text-small text-muted&#x27;;
        warning.textContent = errors.join(&#x27;；&#x27;);

        if (!validScenarios.length) {
          legend.replaceChildren();
          chart.replaceChildren();
          detail.textContent = &#x27;&#x27;;
          return;
        }

        const horizonSeconds = Number(horizonSelect.value) * 60;
        const results = validScenarios.map(scenario =&gt; simulate(scenario, horizonSeconds));
        renderLegend(results);
        renderChart(results, horizonSeconds);
        setPeakDetail(results);
      }

      addButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (scenarios.length &gt;= MAX_SCENARIOS) return;
        const scenarioId = nextId;
        scenarios.push({
          id: scenarioId,
          name: scenarioId &lt;= 26 ? `方案 ${String.fromCharCode(64 + scenarioId)}` : `方案 ${scenarioId}`,
          initial: 30,
          max: 1800,
          lower: -0.5,
          upper: 0.5
        });
        nextId += 1;
        renderScenarioRows();
        render();
      });
      horizonSelect.addEventListener(&#x27;change&#x27;, render);

      renderScenarioRows();
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
