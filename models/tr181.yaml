parameters:
  # ===================== DeviceInfo =====================
  # 公共 DeviceInfo 参数（Manufacturer/OUI/ProductClass/SerialNumber/HardwareVersion/
  # SoftwareVersion/ProvisioningCode/UpTime）位于共享文件 deviceinfo.yaml，加载时自动合并。
  # 此处仅保留 TR-181 独有的 DeviceInfo 参数。
  - path: Device.DeviceInfo.AdditionalHardwareVersion
    type: xsd:string
    value: ""
    writable: false
    notification: 0
  - path: Device.DeviceInfo.AdditionalSoftwareVersion
    type: xsd:string
    value: ""
    writable: false
    notification: 0
  - path: Device.DeviceInfo.FirstUseDate
    type: xsd:dateTime
    value: "0001-01-01T00:00:00Z"
    writable: false
    notification: 0
  - path: Device.DeviceInfo.DeviceLog
    type: xsd:string
    value: ""
    writable: false
    notification: 0

  # ===================== ManagementServer =====================
  - path: Device.ManagementServer.URL
    type: xsd:string
    value: "${acs.url}"
    writable: true
    notification: 0
  - path: Device.ManagementServer.Username
    type: xsd:string
    value: "admin"
    writable: true
    notification: 0
  - path: Device.ManagementServer.Password
    type: xsd:string
    value: "admin"
    writable: true
    notification: 0
  - path: Device.ManagementServer.PeriodicInformEnable
    type: xsd:boolean
    value: "true"
    writable: true
    notification: 0
  - path: Device.ManagementServer.PeriodicInformInterval
    type: xsd:unsignedInt
    value: "300"
    writable: true
    notification: 0
  - path: Device.ManagementServer.ConnectionRequestURL
    type: xsd:string
    value: "${conn.req.url}"
    writable: false
    notification: 0
  - path: Device.ManagementServer.ConnectionRequestUsername
    type: xsd:string
    value: "admin"
    writable: true
    notification: 0
  - path: Device.ManagementServer.ConnectionRequestPassword
    type: xsd:string
    value: "admin"
    writable: true
    notification: 0
  - path: Device.ManagementServer.ParameterKey
    type: xsd:string
    value: ""
    writable: false
    notification: 0
  - path: Device.ManagementServer.AliasBasedAddressing
    type: xsd:boolean
    value: "false"
    writable: false
    notification: 0

  # ===================== PON (GPON Interface) =====================
